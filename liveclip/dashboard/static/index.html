<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>切片后台状态</title>
<link rel="icon" href="data:,">
<!-- 不用任何外部库/字体：单文件、无构建、CDN 慢也不会白屏。时间轴、费用条都是手写的（见 drawTimeline）。 -->
<style>
/* ================= 设计变量 ================= */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#14161b; --ink-2:#374151; --muted:#6b7280; --faint:#9ca3af; --line:#e6e8ec; --soft:#f2f4f7; --soft-2:#e9ecf1;
  --accent:#2563eb; --accent-2:#7c3aed; --accent-soft:#e0eaff; --good:#15803d; --good-soft:#dcfce7; --good-mark:#22c55e;
  --warn:#b45309; --warn-soft:#fef3c7; --warn-mark:#f59e0b; --bad:#dc2626; --bad-soft:#fee2e2; --dy:#111827; --bili:#fb7299;
  --s9:#16a34a; --s8:#2563eb; --s7:#94a3b8;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --r:14px; --gut:24px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0f13; --panel:#161920; --ink:#e8eaef; --ink-2:#c9ced8; --muted:#9aa3b2; --faint:#6b7280; --line:#262a34; --soft:#1d212a; --soft-2:#262b36;
    --accent:#5b9dff; --accent-2:#a78bfa; --accent-soft:#17305a; --good:#4ade80; --good-soft:#12301f; --good-mark:#22c55e;
    --warn:#fbbf24; --warn-soft:#3a2c0b; --warn-mark:#f59e0b; --bad:#f87171; --bad-soft:#3b1616; --dy:#e5e7eb;
    --s9:#22c55e; --s8:#5b9dff; --s7:#64748b; --shadow:none; color-scheme:dark;
  }
}
@media (max-width:640px){ :root{--gut:14px} }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;overflow-x:hidden}
button{font:inherit}
.num{font-variant-numeric:tabular-nums}

/* ================= 顶栏 ================= */
header{display:flex;align-items:center;gap:10px 14px;padding:14px var(--gut);flex-wrap:wrap;background:var(--bg)}
@media (min-width:761px){header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent}
  header.scrolled{border-bottom-color:var(--line)}}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.sub{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
.right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bj{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.bj small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
@media (max-width:640px){header{gap:6px 10px}.right{margin-left:0;width:100%;justify-content:space-between}.bj{font-size:13px}}
.mockflag{font-size:11px;font-weight:700;color:#fff;background:var(--accent-2);padding:1px 7px;border-radius:5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--good-mark);box-shadow:0 0 0 3px var(--good-soft)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.dot.warn{background:var(--warn-mark);box-shadow:0 0 0 3px var(--warn-soft)}
.dot.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px transparent}}

/* ================= 布局 ================= */
main{padding:6px var(--gut) 40px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 360px;max-width:1680px;margin:0 auto}
@media (max-width:1100px){main{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-content:start;min-width:0}
.col > *{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
@media (max-width:640px){.panel{padding:14px}}
.panel > h2{font-size:14px;margin:0 0 14px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.panel > h2 .meta{margin-left:auto;font-weight:400;color:var(--muted);font-size:12px;min-width:0;overflow-wrap:anywhere}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:10px;margin:0 var(--gut) 10px;font-size:13px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}

/* ================= 健康卡 ================= */
.health{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.health{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;box-shadow:var(--shadow)}
.hcard .k{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px}
.hcard .v{font-size:15.5px;font-weight:650;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .s{color:var(--muted);font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ================= 流水线 ================= */
.pipe{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:2px 0 0}
.node{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.node::before{content:"";position:absolute;top:16px;right:50%;width:100%;height:2px;background:var(--line);z-index:0}
.node:first-child::before{display:none}
.node.done::before{background:var(--accent)}
.node.active::before{background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 12px);background-size:24px 2px;animation:flow 1s linear infinite}
@keyframes flow{to{background-position:24px 0}}
.ring{position:relative;z-index:1;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none;
  background:var(--panel);border:2px solid var(--line);color:var(--faint)}
.node.done .ring{background:var(--accent);border-color:var(--accent);color:#fff}
.node.active .ring{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.node.active .ring::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:.5;animation:halo 1.6s ease-out infinite}
@keyframes halo{from{transform:scale(.85);opacity:.6}to{transform:scale(1.2);opacity:0}}
.node .lbl{margin-top:7px;font-size:12px;font-weight:600;color:var(--muted);line-height:1.25;padding:0 2px;overflow-wrap:anywhere;min-height:2.5em}
.node.done .lbl{color:var(--ink-2)}
.node.active .lbl{color:var(--accent)}
.node .tm{font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums;min-height:16px}
@media (max-width:760px){
  .pipe{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .node{flex-direction:row;gap:7px;text-align:left;background:var(--soft);border-radius:9px;padding:6px 8px}
  .node::before{display:none}
  .ring{width:20px;height:20px;font-size:10.5px;border-width:1.5px}
  .node.active{background:var(--accent-soft)}
  .node.active .ring::after{inset:-4px}
  .node .lbl{margin:0;min-height:0;font-size:11.5px}
  .node .tm{display:none}
}

/* ================= 本场 ================= */
.shead{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-bottom:14px}
.shead .who{font-size:15px;font-weight:700}
.shead .when{color:var(--muted);font-size:12.5px}
.shead .id{margin-left:auto;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:6px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.tag.live{color:#fff;background:var(--bad)}
.tag.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.tag.ended{background:var(--soft-2);color:var(--ink-2)}
.tag.wrap{background:var(--warn-soft);color:var(--warn)}
.tag.wait{background:var(--soft);color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:20px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.tile{background:var(--soft);border-radius:12px;padding:10px 12px;min-width:0}
.tile .n{font-size:21px;font-weight:750;font-variant-numeric:tabular-nums;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .n small{font-size:12px;font-weight:550;color:var(--muted);margin:0 2px}
.tile .n.word{font-size:18px}
.tile .l{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 时间轴（drawTimeline 按像素排版，标签永不重叠） */
.tl{position:relative;user-select:none;-webkit-user-select:none;min-height:60px}
.tl-flag{position:absolute;height:20px;line-height:20px;font-size:11.5px;font-weight:650;padding:0 7px;border-radius:6px;white-space:nowrap;z-index:3;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.tl-flag.picked{background:var(--good-soft);color:var(--good)}
.tl-flag.now{background:var(--bad);color:#fff}
.tl-flag.now::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:blink 1.4s ease-in-out infinite}
.tl-flag.idle{background:var(--ink);color:var(--panel)}
.tl-flag.next{background:var(--soft);color:var(--muted);font-weight:600}
.tl-flag.end{background:var(--ink);color:var(--panel)}
.tl-flag.wrap{background:var(--warn-soft);color:var(--warn)}
.tl-line{position:absolute;width:0;z-index:2;pointer-events:none;border-left:2px solid var(--ink)}
.tl-line.picked{border-left-color:var(--good-mark)}
.tl-line.now{border-left-color:var(--bad)}
.tl-line.next{border-left:1.5px dashed var(--faint)}
.tl-line.wrap{border-left-color:var(--warn-mark)}
.tl-grid{position:absolute;width:0;border-left:1px dashed var(--line);pointer-events:none}
.tl-pill{position:absolute;height:10px;border-radius:3px;cursor:pointer;z-index:1;transition:transform .1s}
.tl-pill.unpub{opacity:.38}
.tl-pill:hover{transform:scaleY(1.5);opacity:1;z-index:4;box-shadow:0 0 0 1.5px var(--panel),0 0 0 3px var(--ink)}
.tl-bar{position:absolute;left:0;right:0;height:14px;border-radius:7px;overflow:hidden;
  background:repeating-linear-gradient(135deg,var(--soft) 0 5px,var(--soft-2) 5px 10px)}
.tl-seg{position:absolute;top:0;bottom:0;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
.tl-seg.gap{box-shadow:inset -1px 0 0 var(--panel)}
.tl-seg.fb{background:var(--warn-mark)}
.tl-tick{position:absolute;font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-tick::before{content:"";position:absolute;left:50%;top:-5px;height:4px;border-left:1px solid var(--faint)}
.tl-tick.first::before{left:0}.tl-tick.last::before{left:auto;right:0}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;min-width:0}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:4px}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.dy{background:var(--dy);color:var(--panel)}
.chip.bili{background:var(--bili);color:#fff}
.chip.run{background:var(--accent-soft);color:var(--accent)}
.chip.s9{background:var(--s9);color:#fff;font-weight:700}
.chip.s8{background:var(--s8);color:#fff;font-weight:700}
.chip.s7{background:var(--soft-2);color:var(--ink);font-weight:700}
.fullrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.fullrow .lab{font-size:12.5px;font-weight:650;color:var(--ink-2);margin-right:4px}
a.btn{text-decoration:none;display:inline-block}

/* ================= 选段决策 ================= */
.nowbar{display:flex;gap:10px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;min-width:0;overflow-wrap:anywhere}
.nowbar.idle{background:var(--soft);color:var(--muted);font-weight:500}
.nowbar.ok{background:var(--good-soft);color:var(--good)}
.nowbar .spin{flex:none}
.round + .round{border-top:1px solid var(--line)}
.round > summary{list-style:none;cursor:pointer}
.round > summary::-webkit-details-marker{display:none}
.rhead{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding:9px 0}
.rhead::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin:0 3px 0 1px}
.round[open] > .rhead::before{transform:rotate(45deg)}
.rhead .pills{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.rhead b{font-size:13.5px}
.rhead .sum{font-size:12px;color:var(--muted)}
.round[open]{padding-bottom:10px}
.dec{border:1px solid var(--line);border-radius:10px;margin-top:6px;overflow:hidden}
.dec summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px}
.dec summary::-webkit-details-marker{display:none}
.dec summary:hover{background:var(--soft)}
.dec[open] summary{background:var(--soft)}
.badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}
.badge.picked{background:var(--good-soft);color:var(--good)}
.badge.deferred{background:var(--warn-soft);color:var(--warn)}
.badge.overlap,.badge.unknown{background:var(--soft);color:var(--muted)}
.badge.dropped{background:var(--bad-soft);color:var(--bad)}
.dec .tt{min-width:0}
.dec .tt b{font-size:13px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dec .tt div{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--soft-2);border-radius:6px;padding:2px 7px;white-space:nowrap}
.dec .detail{padding:6px 14px 12px;font-size:12.5px;line-height:1.65;display:grid;gap:8px;overflow-wrap:anywhere}
.dec .detail .k{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:1px}
.dec .detail .m{color:var(--muted);font-size:12px}
.hooks{display:grid;gap:6px}
.hk{border-left:3px solid var(--line);padding-left:8px}
.hk.best{border-left-color:var(--good-mark)}
.hk q{font-weight:600}
@media (max-width:640px){.dec summary{grid-template-columns:minmax(0,1fr) auto;gap:4px 8px}.dec summary .badge{grid-column:1/-1;justify-self:start}}

/* ================= 出片墙 ================= */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px}
@media (max-width:640px){.wall{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}}
.group + .group{margin-top:20px}
.ghead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650;margin-bottom:10px}
.ghead .n{font-size:12px;font-weight:600;color:var(--muted);background:var(--soft);border-radius:999px;padding:0 8px}
.ghead .bar2{flex:1;height:1px;background:var(--line)}
.seg2{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px;gap:2px;flex:none}
.seg2 button{appearance:none;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:3px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg2 button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.clip{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;position:relative;min-width:0}
.clip.lifted{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 8px 20px -10px var(--accent)}
.clip .ribbon{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--accent);color:#fff;z-index:1;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.clip .num{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:rgba(0,0,0,.55);color:#fff;z-index:1}
.clip .cov{position:relative;aspect-ratio:3/4;background:var(--soft);cursor:pointer;overflow:hidden}
.clip .cov img{width:100%;height:100%;object-fit:cover;display:block}
.clip .cov .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .15s;background:rgba(0,0,0,.18)}
.clip .cov:hover .play{opacity:1}
.clip .cov .play b{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.clip .cov .play b::after{content:"";border-left:13px solid #111;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
.clip .body{padding:9px 10px 10px;display:flex;flex-direction:column;flex:1;gap:6px;min-width:0}
.clip .ttl{font-size:13px;font-weight:600;line-height:1.35;min-height:2.7em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.clip .m{color:var(--muted);font-size:11.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip .chips{margin-top:0;gap:4px}
.clip .chips .chip{font-size:11.5px;padding:1px 7px}
.btn{appearance:none;border:0;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--soft-2);color:var(--ink)}
.clip .btn{margin-top:auto;width:100%}
.qawhy{font-size:11.5px;line-height:1.4;border-radius:6px;padding:4px 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.qawhy.bad{background:var(--bad-soft);color:var(--bad)}
.qawhy.warn{background:var(--warn-soft);color:var(--warn)}
.more{display:flex;justify-content:center;margin-top:12px}

/* ================= 右栏 ================= */
.feed{max-height:420px;overflow:auto;display:grid;gap:1px;overscroll-behavior:contain}
.ev{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;font-size:12.5px;padding:5px 6px;border-radius:6px}
.ev:nth-child(odd){background:var(--soft)}
.ev .tm{color:var(--muted);font-variant-numeric:tabular-nums}
.ev .msg{overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ev.good .msg{color:var(--good)} .ev.bad .msg{color:var(--bad)} .ev.warn .msg{color:var(--warn)}
.list{display:grid;gap:10px;font-size:13px}
.row{display:flex;gap:8px;align-items:flex-start;min-width:0}
.row .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.row .muted{color:var(--muted);font-size:12px}
.qitem{border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.qitem .t{font-weight:600;font-size:13px;overflow-wrap:anywhere}
.qitem .s{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.qitem .note{font-size:12px;margin-top:5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.qitem .note.bad{color:var(--bad)} .qitem .note.wait{color:var(--muted)}
.qitem .btn{margin-top:8px}
.spin{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .8s linear infinite;vertical-align:-1px}
@keyframes rot{to{transform:rotate(360deg)}}

/* ================= 花费 ================= */
.eye{appearance:none;border:0;background:var(--soft);color:var(--muted);border-radius:7px;width:28px;height:24px;display:inline-grid;place-items:center;cursor:pointer;padding:0}
.eye:hover{color:var(--ink)}
.eye svg{width:16px;height:16px}
.masked .ctile .n,.masked .crow .amt,.masked .cnote b{filter:blur(6px);user-select:none}
.ctiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.ctile{background:var(--soft);border-radius:10px;padding:8px 10px;min-width:0}
.ctile .n{font-size:17px;font-weight:750;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:5px;line-height:1.3}
.ctile .n small{font-size:12px;font-weight:600;color:var(--muted)}
.ctile .l{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.ck{font-size:12px;color:var(--muted);margin-bottom:2px}
.crow{display:grid;grid-template-columns:minmax(64px,max-content) minmax(30px,1fr) auto;gap:8px;align-items:center;font-size:12.5px;margin-top:7px}
.crow .track2{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.crow .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.crow .fill.cny{background:var(--good-mark)}
.crow .amt{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.cnote{font-size:11.5px;color:var(--muted);margin-top:12px;line-height:1.55}

/* ================= 弹窗 / 浮层 ================= */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.open{display:flex}
.modal video{max-height:88vh;max-width:min(92vw,520px);border-radius:12px;background:#000}
.xbtn{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.dlg{background:var(--panel);border-radius:16px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:20px;display:grid;gap:14px;position:relative}
.dlg h3{margin:0;font-size:16px}
.dlg .top{display:flex;gap:14px;min-width:0}
.dlg .top img{width:88px;border-radius:8px;aspect-ratio:3/4;object-fit:cover;flex:none}
.dlg .warnbox{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:12.5px;overflow-wrap:anywhere}
.plat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;overflow-wrap:anywhere}
.plat label{display:flex;align-items:center;gap:8px;font-weight:600}
.plat .tags{font-size:12px;color:var(--muted)}
.when{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.when input[type=datetime-local]{font:inherit;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--ink);max-width:100%}
.dlg .actions{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.dlg .msg{font-size:12.5px;color:var(--bad);margin-right:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 16px;border-radius:999px;font-size:13px;z-index:30;display:none;max-width:90vw}
.tip{position:fixed;z-index:25;pointer-events:none;background:var(--ink);color:var(--panel);font-size:12px;line-height:1.45;padding:6px 9px;border-radius:8px;max-width:300px;white-space:pre-line;display:none;box-shadow:0 6px 16px rgba(0,0,0,.2)}

/* ================= 手动上传剪辑（2026-10-14） ================= */
.upgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
@media (max-width:760px){.upgrid{grid-template-columns:minmax(0,1fr)}}
.drop{position:relative;border:1.5px dashed var(--faint);border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:20px 14px;cursor:pointer;min-height:150px;transition:border-color .15s,background .15s;min-width:0}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop.off{opacity:.55;cursor:not-allowed}
.drop svg{width:30px;height:30px;color:var(--accent);margin-bottom:2px}
.drop b{font-size:14px}
.drop span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.drop input{display:none}
.upopts{display:grid;gap:8px;align-content:start;min-width:0}
.upopts .f{display:grid;gap:3px;color:var(--muted);font-size:12px;font-weight:600;min-width:0}
.upopts input[type=text],.upopts select,.upopts textarea{font:inherit;font-size:13px;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%;min-width:0}
.upopts textarea{resize:vertical;min-height:50px}
.upopts .row2{display:flex;gap:6px 14px;align-items:flex-end;flex-wrap:wrap}
.upopts .row2 .f{flex:1 1 150px}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;padding-bottom:6px}
.uphint{font-size:11.5px;color:var(--muted);line-height:1.45}
.jobs{display:grid;gap:10px}
.job{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.job.run{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft)}
.job .jh{display:flex;gap:6px 10px;align-items:flex-start;min-width:0;flex-wrap:wrap}
.job .jt{flex:1 1 200px;min-width:0}
.job .jt b{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .jt div{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:1px}
.job .je{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:center}
.jsteps{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.jsteps > span{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--faint);white-space:nowrap;display:inline-flex;gap:5px;align-items:center}
.jsteps > span.done{color:var(--ink-2);background:var(--soft-2)}
.jsteps > span.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
.jsteps > span.bad{background:var(--bad-soft);color:var(--bad);font-weight:650}
.jerr{margin-top:10px;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:9.5em;overflow:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.jerr.soft{background:var(--soft);color:var(--muted);font-family:inherit}
.jact{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.jact .muted{font-size:12px;color:var(--muted);margin-left:auto;overflow-wrap:anywhere}
.jclips{margin-top:12px}
#upxfer:not(:empty){margin-bottom:10px}
.bar{height:6px;border-radius:3px;background:var(--soft-2);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .2s}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.older{margin-top:4px}
.older > summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600;padding:6px 0;display:flex;align-items:center;gap:6px}
.older > summary::-webkit-details-marker{display:none}
.older > summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin:0 3px 0 1px}
.older[open] > summary::before{transform:rotate(45deg)}
.older .jobs{margin-top:6px}
.dropcover{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--accent) 16%,transparent);border:3px dashed var(--accent);display:none;align-items:center;justify-content:center;pointer-events:none}
.dropcover.on{display:flex}
.dropcover b{background:var(--panel);color:var(--accent);padding:14px 22px;border-radius:14px;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
/* 播放器：原版 / 精剪 切换 */
.vbox{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.vswitch{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;justify-content:center;color:#e5e7eb;font-size:12.5px;font-variant-numeric:tabular-nums}
.vswitch .seg2{background:rgba(255,255,255,.14)}
.vswitch .seg2 button{color:#d1d5db}
.vswitch .seg2 button.on{background:#fff;color:#111}
.vswitch:empty{display:none}
.vbox video{max-height:calc(88vh - 40px)}

/* 窄屏：卡片里的字允许换行（放在最后，盖过上面的单行省略） */
@media (max-width:760px){
  .hcard{padding:10px 12px}.hcard .v{font-size:14.5px;white-space:normal;overflow-wrap:anywhere}
  .hcard .s{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .tile .l{white-space:normal;line-height:1.35}
}
/* 顶部两个标签页：直播跟播 / 手动上传剪辑；截图模式不受影响 */
.tabs{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px;flex:none}
.tabs button{appearance:none;border:0;background:transparent;color:var(--muted);font-size:13.5px;font-weight:650;padding:6px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tbadge{font-size:11px;font-weight:700;line-height:1;padding:3px 6px;border-radius:999px;background:var(--accent);color:#fff;font-variant-numeric:tabular-nums}
.tbadge:empty{display:none}
.tbadge.live{background:var(--bad)}
@media (max-width:640px){.tabs{order:5;width:100%}.tabs button{flex:1;justify-content:center}}
body:not(.shot)[data-tab=live] #upPanel{display:none !important}
.evrow{display:flex;gap:8px}.evrow input{flex:1;min-width:0;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
body:not(.shot)[data-tab=live] #notePanel{display:block}
body:not(.shot)[data-tab=upload] :is(#notePanel,#health,#pipePanel,#session,#decPanel,#wallPanel,#eventsPanel,#syncPanel,#probsPanel){display:none !important}

/* 截图模式 ?only=…：只留指定的几块，铺满一列 */
body.shot main{grid-template-columns:minmax(0,1fr);max-width:1180px}
body.shot header{position:static}
body.shot .col > *{display:none !important}
body.shot .col > .keep{display:block !important}
body.shot .col > .health.keep{display:grid !important}
</style>
</head>
<body>
<header id="hdr">
  <h1 data-i18n="title"></h1>
  <span class="sub"><span class="dot" id="conn"></span><span id="updated"></span></span>
  <span id="mockflag"></span>
  <nav class="tabs" id="tabs"><button data-tab="live"><span data-i18n="tabLive"></span><span class="tbadge" id="tbLive"></span></button><button data-tab="upload"><span data-i18n="tabUpload"></span><span class="tbadge" id="tbUp"></span></button></nav>
  <div class="right">
    <span class="bj" id="bj"></span>
    <span class="seg2"><button data-lang="zh">中文</button><button data-lang="en">EN</button></span>
  </div>
</header>
<div id="err"></div>
<main>
  <div class="col">
    <div class="health" id="health"></div>
    <section class="panel" id="pipePanel">
      <h2><span data-i18n="pipeline"></span> <span class="meta" id="nowstep"></span></h2>
      <div class="pipe" id="steps"></div>
    </section>
    <section class="panel" id="notePanel">
      <h2><span data-i18n="evTitle"></span> <span class="meta" data-i18n="evHint"></span></h2>

    </section>
    <section class="panel" id="session"></section>
    <section class="panel" id="decPanel">
      <h2><span data-i18n="decisions"></span> <span class="meta" id="decmeta"></span></h2>
      <div id="decnow"></div>
      <div id="dec"></div>
    </section>
    <section class="panel" id="wallPanel">
      <h2><span data-i18n="clipsTitle"></span> <span class="meta" id="clipmeta"></span></h2>
      <div id="wall"></div>
    </section>
    <section class="panel" id="upPanel">
      <h2><span data-i18n="upTitle"></span> <span class="meta" id="upmeta"></span></h2>
      <div class="upgrid">
        <label class="drop" id="drop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          <b data-i18n="upDrop"></b><span id="upexts"></span>
          <input type="file" id="upfile" multiple accept="video/*,.mp4,.mov,.ts,.mkv,.flv,.m4v,.webm">
        </label>
        <div class="upopts">
          <label class="f"><span data-i18n="upTitleLbl"></span><input type="text" id="upTitle" maxlength="60" autocomplete="off"></label>
          <div class="row2">
            <label class="f"><span data-i18n="upTopLbl"></span><select id="upTop"></select></label>
            <label class="tg"><input type="checkbox" id="upTight" checked> <span data-i18n="upTight"></span></label>
            <label class="tg"><input type="checkbox" id="upBurn" checked> <span data-i18n="upBurn"></span></label>
          </div>
          <label class="f"><span data-i18n="upNoteLbl"></span><textarea id="upNote" maxlength="500" rows="2"></textarea></label>
          <div class="uphint" data-i18n="upHint"></div>
        </div>
      </div>
      <div class="jobs" id="upxfer"></div>
      <div id="upjobs"></div>
    </section>
  </div>
  <div class="col">
    <section class="panel" id="costPanel" style="display:none">
      <h2><span data-i18n="cost"></span> <button class="eye" id="eye"></button> <span class="meta" id="costmeta"></span></h2>
      <div id="cost"></div>

    <section class="panel" id="queuePanel">
      <h2><span data-i18n="queue"></span> <span class="meta" id="qmeta"></span></h2>
      <div class="list" id="queue"></div>
    </section>
    <section class="panel" id="eventsPanel">
      <h2><span data-i18n="events"></span> <span class="meta" data-i18n="newestFirst"></span></h2>
      <div class="feed" id="feed"></div>
    </section>
    <section class="panel" id="pubPanel">
      <h2 data-i18n="published"></h2>
      <div class="list" id="pub"></div>
    </section>
    <section class="panel" id="syncPanel">
      <h2><span data-i18n="sync"></span> <span class="meta" id="syncmeta"></span></h2>
      <div class="list" id="ups"></div>
    </section>
    <section class="panel" id="probsPanel">
      <h2 data-i18n="attention"></h2>
      <div class="list" id="probs"></div>
    </section>
  </div>
</main>
<div class="modal" id="vmodal"><button class="xbtn" data-xv aria-label="close">×</button><div class="vbox"><div class="vswitch" id="vswitch"></div><video id="player" controls playsinline></video></div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
let LAST = null;
let TZ = 'Asia/Shanghai', TZL = '北京', PUB_ON = {douyin: false, bili: false};   // 由 /api/status 的 tz / publish_enabled 覆盖
const ALLCLIPS = new Map();   // 片子编号 → 卡片数据（本场出片 + 手动上传），发布弹窗用

// ---------- 中英文 ----------
const L = {
  zh: {
    title: '切片后台状态', updated: (t) => `更新于 ${t} · 每 5 秒刷新`, connecting: '连接中…', cantConnect: '连不上面板服务：', stale: '（显示的是上次拿到的数据）',
    pipeline: '流水线', decisions: '选段决策', clipsTitle: '本场出片', cost: '花费', queue: '发布队列', events: '事件',
    newestFirst: '最新在上', published: '发布记录', sync: '云端同步', attention: '待注意',
    bj: () => TZL, local: '本地', douyin: '抖音', bili: 'B站',
    recServer: '录制服务器', notConfigured: '未配置', cantReach: '连不上', recording: (e) => `录制中 ${e}`, standby: '待机（没人开播）',
    watching: (n) => `盯 ${n} 个直播间`, cloudSync: '云端同步', latest: (t) => `最近 ${t}`, none: '还没有',
    editor: '剪辑机', running: '剪辑中', standbyEd: '待命', notRunning: '没在运行', uptime: (u) => `已运行 ${u}`, paused: '剪辑暂停，开机后自动补上',
    doing: '正在做', idleWait: '空闲，等新内容', elapsed: (e) => `已 ${e}`, lastStep: (t) => `上一步 ${t}`,
    nowDoing: (s) => `正在：${s}`, recWaiting: '录制中，等下一段', idle: '空闲',
    live: '直播', noSession: '还没有跟播记录', noSessionHint: '有人开播后，这里会显示录制进度、选段时间轴和出片。',
    startedAt: (t) => `${TZL}时间 ${t} 开播`, ended: '已结束', wrapping: '收尾中', waitingNew: '等新内容',
    tDur: '时长', transcribed: (n) => `已转写 ${n} 段`, rounds: '轮', roundsLbl: '选段轮次', pickedTo: (t) => `已挑到 ${t}`, allPicked: '整场都挑完了',

    stateWrap: '收尾中', stateWrapL: '已下播，处理剩下的部分', clipsN: '条', clipsLbl: (p, t) => `已发布 ${p} · 待发布 ${t}`,
    dur: (h, m) => h ? `${h}小时${m ? m + '分' : ''}` : `${m}分钟`, durHTML: (h, m) => h ? `${h}<small>小时</small>${m}<small>分</small>` : `${m}<small>分钟</small>`,
    flagPicked: (t) => `已挑到 ${t}`, flagNow: (t) => `现在 ${t}`, flagNowAll: (t) => `现在 ${t} · 已挑完`, flagNext: (t) => `下一轮 ${t}`,
    flagEnd: (d) => `已结束 · ${d}`, flagWrap: (d) => `已下播 · ${d}`, flagPaused: (t) => `录到 ${t}`,
    segN: (n) => `第 ${n} 段`, roundN: (n) => `第 ${n} 轮`, legendTranscribed: '已转写', legendFallback: '备用识别', legendFuture: '还没录到',
    legendScore: (s) => s, legendPub: '实心 = 已发布，浅色 = 未发布', deferredLbl: '留到下一轮',
    dec: {picked: '选中', deferred: '留到下一轮', overlap: '重叠跳过', dropped: '规则筛掉', unknown: '未采用'},
    picking: (r) => `正在挑第 ${r} 轮：读这段字幕，找能单独成片的段落`, cutting: (r, n, t) => `正在剪第 ${r} 轮的 ${n} 条：${t}`,
    allDone: '整场已结束，所有轮次都处理完了', waitNext: (t) => `等字幕到 ${t} 开始下一轮`, leftOver: (n, t) => `；上一轮留下 ${n} 条等着再比：${t}`,
    seenPicked: (a, b) => `共看了 ${a} 个候选，选中 ${b}`, candN: (n) => `候选 ${n} 条`, notYet: '还没挑过',
    hook: '开头预告', whyPick: '为什么挑它', ctxCheck: '断章取义检查', minRange: (a, b, d) => `第 ${a}–${b} 分钟 · ${d} 秒`, risky: '有争议',
    score: (s) => `${s}分`, scoreTip: '选段打分', sep: '、',
    st: {done: '✓', pending: '排队', running: '发布中', failed: '✗', waiting: '等待重试'}, publishing: '正在发布', todo: '待发布', done: '已发布',
    byScore: '按分数', byTime: '按时间', noClips: '这场还没出片', publishingBtn: '发布中…', publishBtn: '发布',

function hcard(k, v, s, state){
  return `<div class="hcard"><div class="k"><span class="dot ${state}"></span>${esc(k)}</div><div class="v" title="${esc(v)}">${esc(v)}</div><div class="s" title="${esc(s)}">${esc(s)}</div></div>`;
}

function renderHealth(d){
  const v = d.rec || {}, m = d.editor || {};
  const live = (v.live || [])[0], lastUp = (v.uploads || []).slice(-1)[0], cur = m.current;
  const noRec = d.recorder_configured === false;   // 没配置录制机（recorder.ssh_host）：灰色，不算故障
  $('health').innerHTML =
    (noRec ? hcard(T('recServer'), T('notConfigured'), 'recorder.ssh_host', '') :
    hcard(T('recServer'), v.error ? T('cantReach') : live ? T('recording', live.elapsed) : T('standby'),
          v.error ? v.error : `${live ? live.name : T('watching', v.watching ?? '?')}${v.note ? ' · ' + v.note : ''}`,
          v.error || v.ok === false ? 'bad' : live ? 'on pulse' : '')) +
    hcard(T('cloudSync'), lastUp ? T('latest', lastUp.t.slice(6, 11)) : '—', lastUp ? lastUp.msg.split('/').pop() : T('none'),
          v.sync_ok ? 'on' : (v.checked && !noRec ? 'bad' : '')) +
    hcard(T('editor'), m.running ? T(cur ? 'running' : 'standbyEd') : T('notRunning'), m.running ? T('uptime', m.uptime) + (m.note ? ' · ' + m.note : '') : T('paused'),
          m.running ? (m.warn ? 'warn' : 'on') : 'bad') +
    hcard(T('doing'), d.step_name || (m.running ? T('idleWait') : '—'),
          cur ? T('elapsed', cur.elapsed) : (m.last_log ? T('lastStep', m.last_log.slice(6)) : ''), cur ? 'on pulse' : '');
}

function renderPipeline(d){

    const inner = s.state === 'done' ? '✓' : String(i + 1);
    return `<div class="node ${s.state}"><div class="ring">${inner}</div><div class="lbl">${esc(s.name)}</div><div class="tm">${esc(s.t)}</div></div>`;
  }).join('');
  const cur = (d.editor || {}).current;
  $('nowstep').textContent = d.step_name ? T('nowDoing', d.step_name + (cur ? ' · ' + cur.elapsed : '')) : (live ? T('recWaiting') : T('idle'));
}

  const dr = (ses.decisions || {}).rounds || [], cand = dr.reduce((a, r) => a + r.items.length, 0);
  const t3 = ses.done ? `<div class="n">${ses.clips.length}<small>/ ${cand}</small></div><div class="l">${T('candPicked')}</div>`
    : ses.ended ? `<div class="n word" style="color:var(--warn)">${T('stateWrap')}</div><div class="l">${T('stateWrapL')}</div>`
    : left < 0.5 ? `<div class="n word">—</div><div class="l">${T('nextSoon')}</div>`
    : `<div class="n">${Math.ceil(left)}<small>${T('nextIn')}</small></div><div class="l" title="${esc(T('nextLbl', fmtHM(ses.next_round_min)))}">${T('nextLbl', fmtHM(ses.next_round_min))}</div>`;
  const allPicked = ses.done || (ses.ended && ses.total_min - ses.picked_until_min < 0.5);
  const full = ses.full && ses.full.ready
    ? `<button class="btn" data-v="${esc(ses.full.video)}">${T('fullVideo')} · ${ses.full.size_gb}GB</button>${ses.full.srt ? `<a class="btn ghost" href="${esc(ses.full.srt)}" download="字幕.srt">${T('fullSrt')}</a>` : ''}${ses.full.cloud === 'off' ? '' : `<span class="chip ${ses.full.cloud === 'ok' ? 'good' : ses.full.cloud === 'fail' ? 'bad' : ''}">${T({ok: 'cloudOk', fail: 'cloudFail'}[ses.full.cloud] || 'cloudWait')}</span>`}`
    : `<span class="chip">${T('fullPending')}</span>`;
  $('session').innerHTML = `
    <div class="shead">${tag}<span class="who">${esc(ses.anchor)}</span><span class="when">${T('startedAt', esc(ses.started_bj || ses.started))}</span><span class="id">${esc(ses.id || '')}</span></div>
    <div class="tiles">
      <div class="tile"><div class="n">${durHTML(ses.total_min)}</div><div class="l">${T('transcribed', ses.segments.length)}</div></div>
      <div class="tile"><div class="n">${ses.rounds}<small>${T('rounds')}</small></div><div class="l">${allPicked ? T('allPicked') : T('pickedTo', fmtHM(ses.picked_until_min))}</div></div>
      <div class="tile">${t3}</div>
      <div class="tile"><div class="n">${ses.clips.length}<small>${T('clipsN')}</small></div><div class="l">${T('clipsLbl', pubN, ses.clips.length - pubN)}</div></div>
    </div>
    <div class="tl" id="tl"></div>
    <div class="legend" id="legend"></div>
    ${ses.deferred.length ? `<div class="chips"><span class="chip">${T('deferredLbl')}</span>${ses.deferred.map(t => `<span class="chip warn" title="${esc(t)}">${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="fullrow"><span class="lab">${T('fullLbl')}</span>${full}</div>`;
  drawTimeline(ses, d);
}

// 时间轴：全部按像素算。刻度间隔随宽度/场长自适应；旗子标签最多两行，排不下就收起（线还在，悬停看）。
const TICK_STEPS = [5, 10, 15, 20, 30, 60, 90, 120, 180, 240];
function drawTimeline(ses, d){
  const box = $('tl'); if (!box) return;
  const W = Math.max(box.clientWidth, 200);
  const live = isLive(ses, d);
  const total = ses.total_min;
  const showNext = !ses.ended && ses.next_round_min - total > 0.5;
  // 横轴范围：结束了就正好到结尾；进行中留出到「下一轮」的位置（未录部分画成斜纹）
  const Dmax = ses.ended ? Math.max(total, 1) : Math.max(total, showNext ? ses.next_round_min : 0, 1) * 1.03;
  tfmt = Dmax < 90 ? (m => `${Math.round(m)}′`) : fmtHM;
  const X = m => Math.min(Math.max(m / Dmax * W, 0), W);

  // ---- 旗子 ----
  const flags = [];
  const pickedGap = total - ses.picked_until_min;
  if (ses.ended) {
    flags.push({m: total, cls: ses.done ? 'end' : 'wrap', text: ses.done ? T('flagEnd', fmtDur(total)) : T('flagWrap', fmtDur(total)), prio: 0, side: 'left'});
    if (!ses.done && pickedGap > 0.5 && ses.picked_until_min > 0) flags.push({m: ses.picked_until_min, cls: 'picked', text: T('flagPicked', tfmt(ses.picked_until_min)), prio: 1, side: 'left'});
  } else {
    const merged = pickedGap < 0.5 && ses.picked_until_min > 0;
    flags.push({m: total, cls: live ? 'now' : 'idle', text: live ? T(merged ? 'flagNowAll' : 'flagNow', tfmt(total)) : T('flagPaused', tfmt(total)), prio: 0, side: 'left'});
    if (!merged && ses.picked_until_min > 0) flags.push({m: ses.picked_until_min, cls: 'picked', text: T('flagPicked', tfmt(ses.picked_until_min)), prio: 1, side: 'left'});
    if (showNext) flags.push({m: ses.next_round_min, cls: 'next', text: T('flagNext', tfmt(ses.next_round_min)), prio: 2, side: 'right'});
  }
  box.innerHTML = '';
  const ROWH = 24, GAP = 6, rows = [[], []];
  let rowsUsed = 0;
  for (const f of flags) {
    const el = document.createElement('div');
    el.className = 'tl-flag ' + f.cls; el.textContent = f.text; el.style.visibility = 'hidden';
    box.appendChild(el);
    const w = el.offsetWidth, x = X(f.m);
    // 标签候选位置：贴在线的左边 / 右边；都放不下就贴边
    let cands = (f.side === 'left' ? [x - w, x] : [x, x - w]).filter(l => l >= 0 && l + w <= W);
    if (!cands.length) cands = [Math.min(Math.max(0, x - w / 2), W - w)];
    let placed = null;
    for (let r = 0; r < rows.length && !placed; r++)
      for (const l of cands)
        if (rows[r].every(([a, b]) => l + w + GAP <= a || l >= b + GAP)) { placed = {r, l}; rows[r].push([l, l + w]); break; }
    f.x = x;
    if (placed) { f.row = placed.r; el.style.left = placed.l + 'px'; el.style.top = placed.r * ROWH + 'px'; el.style.visibility = ''; el.dataset.row = placed.r; rowsUsed = Math.max(rowsUsed, placed.r + 1); f.el = el; }
    else { el.remove(); f.row = null; }
  }
  const flagsH = rowsUsed * ROWH + 4;

  // ---- 出片条：按像素分道，挤在一起时往下一道放（最多 3 道） ----
  const LANEH = 13, MINW = 5;
  const lanesEnd = [];
  const pills = ses.clips.filter(c => c.start_min != null).sort((a, b) => a.start_min - b.start_min).map(c => {
    const x0 = X(c.start_min), x1 = Math.max(X(c.end_min ?? c.start_min), x0 + MINW);
    let lane = lanesEnd.findIndex(e => e + 2 <= x0);
    if (lane < 0) { if (lanesEnd.length < 3) lane = lanesEnd.length; else lane = lanesEnd.indexOf(Math.min(...lanesEnd)); }
    lanesEnd[lane] = x1;
    return {c, x0, x1, lane};
  });
  const nLanes = Math.max(lanesEnd.length, 1);
  const lanesTop = flagsH, barTop = lanesTop + nLanes * LANEH + 6, barH = 14, axisTop = barTop + barH + 8;
  box.style.height = (axisTop + 16) + 'px';

  // ---- 刻度：间隔至少 64px；两端不挤 ----
  const step = TICK_STEPS.find(s => (s / Dmax) * W >= 64) || 240;
  let html = '';
  for (let t = 0; t <= Dmax + 1e-6; t += step) {
    const x = X(t);
    html += `<div class="tl-grid" style="left:${x}px;top:${lanesTop}px;height:${barTop - lanesTop}px"></div>`;
    if (x > W - 22) continue;     // 太靠右边，让给结尾标签
    const cls = t === 0 ? 'first' : '';
    html += `<div class="tl-tick ${cls}" style="left:${x}px;top:${axisTop}px;transform:translateX(${t === 0 ? 0 : -50}%)">${tfmt(t)}</div>`;
  }
  if (ses.ended) html += `<div class="tl-tick last" style="right:0;top:${axisTop}px">${tfmt(total)}</div>`;
  // 出片条
  html += pills.map(({c, x0, x1, lane}) => {
    const tip = T('tipClip', {n: pad(c.n), title: c.title, range: `${fmtHMS(c.start_min)}–${fmtHMS(c.end_min ?? c.start_min)}`, dur: c.dur ?? '?',
      score: c.score != null ? T('score', c.score) : '?', round: c.round ?? '?', pub: isPub(c) ? T('tipPub') : T('tipUnpub')});
    return `<div class="tl-pill ${isPub(c) ? '' : 'unpub'}" ${vidAttrs(c)} data-tip="${esc(tip)}"
      style="left:${x0}px;width:${x1 - x0}px;top:${lanesTop + lane * LANEH}px;background:var(--${scoreCls(c.score ?? 0)})"></div>`;
  }).join('');
  // 转写进度条（分段）
  // 分段够宽时一段一块（中间留缝）；太密就画成一整条，只把备用识别的段叠上去，避免发丝缝
  let acc = 0;
  const segW = ses.segments.length ? X(total) / ses.segments.length : 0, split = segW > 14;
  let segs = split ? '' : `<div class="tl-seg" style="left:0;width:${X(total)}px" data-tip="${esc(T('transcribed', ses.segments.length) + ' · ' + tfmt(total))}"></div>`;
  segs += ses.segments.map(s => { const a = acc; acc += s.dur / 60;
    if (!split && !s.fallback) return '';
    return `<div class="tl-seg ${s.fallback ? 'fb' : ''} ${split ? 'gap' : ''}" style="left:${X(a)}px;width:${Math.max(X(acc) - X(a), 1)}px" data-tip="${esc(T('tipSeg', s.n + 1, tfmt(a), tfmt(acc), s.fallback))}"></div>`; }).join('');
  html += `<div class="tl-bar" style="top:${barTop}px">${segs}</div>`;
  // 旗子竖线：从标签底部画到进度条底部
  html += flags.map(f => {
    const top = f.row == null ? lanesTop - 4 : f.row * ROWH + 20;
    const x = Math.min(Math.max(f.x, 1), W - 1);
    return `<div class="tl-line ${f.cls === 'idle' || f.cls === 'end' ? '' : f.cls}" style="left:${x - 1}px;top:${top}px;height:${barTop + barH + 3 - top}px"${f.row == null ? ` data-tip="${esc(f.text)}"` : ''}></div>`;
  }).join('');
  box.insertAdjacentHTML('beforeend', html);

  // ---- 图例：只列这场真用到的 ----
  const hasFb = ses.segments.some(s => s.fallback), scores = new Set(ses.clips.map(c => scoreCls(c.score ?? 0)));
  $('legend').innerHTML = [
    `<span><i style="background:linear-gradient(90deg,var(--accent),var(--accent-2))"></i>${T('legendTranscribed')}</span>`,
    hasFb ? `<span><i style="background:var(--warn-mark)"></i>${T('legendFallback')}</span>` : '',
    !ses.ended ? `<span><i style="background:repeating-linear-gradient(135deg,var(--soft) 0 3px,var(--soft-2) 3px 6px);border:1px solid var(--line)"></i>${T('legendFuture')}</span>` : '',
    ...['s9', 's8', 's7'].filter(s => scores.has(s)).map(s => `<span><i style="background:var(--${s})"></i>${T('score', {s9: '9+', s8: '8', s7: '≤7'}[s])}</span>`),
    ses.clips.length ? `<span>${T('legendPub')}</span>` : '',
  ].join('');
}

// ---------- 选段决策 ----------
const OPEN = new Set(), ROUND_OPEN = new Map();   // 记住手动展开/收起，刷新时保持
document.addEventListener('click', e => {        // 只认点击，不认渲染时浏览器自己触发的 toggle
  const s = e.target.closest('summary'); if (!s) return;
  const d = s.parentElement;
  if (d.dataset.rk) ROUND_OPEN.set(d.dataset.rk, !d.open);
  if (d.dataset.k) (!d.open ? OPEN.add(d.dataset.k) : OPEN.delete(d.dataset.k));
}, true);
function renderDecisions(ses){
  const dd = ses && ses.decisions;
  if (!dd){ $('decnow').innerHTML = ''; $('decmeta').textContent = ''; $('dec').innerHTML = `<div class="empty">${T('none')}</div>`; return; }
  const now = dd.now || {}, DEC = T('dec');
  $('decnow').innerHTML = now.kind === 'picking' ? `<div class="nowbar"><span class="spin"></span>${T('picking', now.round)}</div>`
    : now.kind === 'cutting' ? `<div class="nowbar"><span class="spin"></span><span>${esc(T('cutting', now.round, dd.cutting.length, dd.cutting.map(c => c.title).join(T('sep'))))}</span></div>`
    : now.kind === 'done' ? `<div class="nowbar ok">✓ ${T('allDone')}</div>`
    : `<div class="nowbar idle">${T('waitNext', fmtHM(now.next_min || 0))}${dd.pending_deferred.length ? esc(T('leftOver', dd.pending_deferred.length, dd.pending_deferred.join(T('sep')))) : ''}</div>`;
  const total = dd.rounds.reduce((a, r) => a + r.items.length, 0), picked = dd.rounds.reduce((a, r) => a + r.count.picked, 0);
  $('decmeta').textContent = total ? T('seenPicked', total, picked) : '';
  const latest = dd.rounds.length ? dd.rounds[0].r : 0;
  $('dec').innerHTML = dd.rounds.length ? dd.rounds.map(r => {
    const c = r.count;
    const sum = ['picked', 'deferred', 'overlap', 'dropped', 'unknown'].filter(k => k === 'picked' || c[k]).map(k => `${DEC[k]} ${c[k]}`).join(' · ');
    const rk = `round-${r.r}`, isOpen = ROUND_OPEN.has(rk) ? ROUND_OPEN.get(rk) : r.r === latest;
    const pills = r.items.filter(x => x.decision === 'picked').map(x => x.n ? `<span class="badge picked">${pad(x.n)}</span>` : '').join('');
    return `<details class="round" data-rk="${rk}" ${isOpen ? 'open' : ''}><summary class="rhead"><b>${T('roundN', r.r)}</b><span class="sum">${T('candN', r.items.length)} → ${sum}</span><span class="pills">${pills}</span></summary>
      ${r.items.map(it => { const k = `${r.r}-${it.title}`;
        const hook = it.hook ? `<div><div class="k">${T('hook')}${it.hook.type ? ' · ' + esc(it.hook.type) : ''}</div>${it.hook.why ? `<div>${esc(it.hook.why)}</div>` : ''}
          <div class="hooks">${(it.hook.cands || []).map((h, j) => `<div class="hk ${j === 0 ? 'best' : ''}"><q>${esc(h.text)}</q> <span class="score">${h.score ?? '?'}</span><div style="color:var(--muted)">${esc(h.reason)}</div></div>`).join('')}</div></div>` : '';
        const cat = it.category ? (T('cat')[it.category] || it.category) : '';
        return `<details class="dec" data-k="${esc(k)}" ${OPEN.has(k) ? 'open' : ''}><summary>
          <span class="badge ${it.decision}">${DEC[it.decision]}</span>
          <span class="tt"><b title="${esc(it.title)}">${it.n ? pad(it.n) + ' ' : ''}${esc(it.title)}</b><div title="${esc(it.reason)}">${esc(it.reason)}</div></span>
          <span class="score" title="${T('scoreTip')}">${T('score', it.score ?? '?')}</span></summary>
          <div class="detail">
            <div class="m">${it.start_min != null ? T('minRange', it.start_min, it.end_min, it.dur) : ''}${cat ? ' · ' + esc(cat) : ''}${it.risky ? ` · <span style="color:var(--warn)">${T('risky')}</span>` : ''}${(it.tags || []).length ? ' · ' + it.tags.map(esc).join(' / ') : ''}</div>
            ${it.why ? `<div><div class="k">${T('whyPick')}</div>${esc(it.why)}</div>` : ''}
            ${it.context_check ? `<div><div class="k">${T('ctxCheck')}</div>${esc(it.context_check)}</div>` : ''}
            ${hook}
          </div></details>`; }).join('')}</details>`;
  }).join('') : `<div class="empty">${T('notYet')}</div>`;
}

// ---------- 出片墙 ----------
let SORT = 'score';
try { SORT = localStorage.getItem('wallSort') || 'score'; } catch (e) {}
const SHOW_ALL = new Set();          // 哪些组点了「显示全部」
const GROUP_CAP = 12;
document.addEventListener('click', e => {
  const b = e.target.closest('[data-sort]');
  if (b){ SORT = b.dataset.sort; try { localStorage.setItem('wallSort', SORT); } catch (err) {} }
  const m = e.target.closest('[data-more]');
  if (m){ const g = m.dataset.more; SHOW_ALL.has(g) ? SHOW_ALL.delete(g) : SHOW_ALL.add(g); }
  if ((b || m) && LAST) safe(renderWall, (LAST.sessions || [])[0], LAST);
});
function platState(c, d){
  // 每个平台：已发 / 队列里（排队、发布中、失败）
  const out = {};
  for (const p of ['douyin', 'bili']) if (c.published[p]) out[p] = {state: 'done'};
  for (const q of (d.queue || []).slice().reverse()) {      // 老的先、新的覆盖
    if (q.key !== c.key || q.status === 'cancelled') continue;
    for (const p of q.platforms) {
      const r = (q.results || {})[p];
      if (out[p] && out[p].state === 'done') continue;
      out[p] = r ? {state: r.state, note: r.note} : {state: q.status === 'pending' ? 'pending' : q.status};
    }
  }
  return out;
}
// 出片卡片（本场出片、手动上传共用）
function clipCard({c, ps}){
  const label = T('st');
  const lv = c.check && (c.check.level || (c.check.ok ? '✓' : '✗'));
  const qa = c.check ? `<span class="chip ${lv === '✓' ? 'good' : lv === '⚠' ? 'warn' : 'bad'}">${T('qa', lv)}</span>` : '';
  const qaWhy = c.check && (c.check.bad || []).length ? `<div class="qawhy ${lv === '✗' ? 'bad' : 'warn'}" title="${esc(c.check.bad.join('; '))}">${esc(c.check.bad.join('; '))}</div>` : '';
  const plat = Object.entries(ps).map(([p, s]) => {
    const cls = s.state === 'done' ? (p === 'bili' ? 'bili' : 'dy') : s.state === 'failed' ? 'bad' : 'run';
    return `<span class="chip ${cls}" title="${esc(s.note || '')}">${PLAT(p)} ${s.state === 'running' ? '<span class="spin"></span>' : label[s.state] || ''}</span>`;
  }).join('');
  const lifted = Object.values(ps).some(s => ['pending', 'running'].includes(s.state));
  const left = ['douyin', 'bili'].filter(p => PUB_ON[p] && (!ps[p] || ps[p].state === 'failed'));
  const pubOff = !PUB_ON.douyin && !PUB_ON.bili;
  const waiting = Object.values(ps).some(s => s.state === 'waiting');
  const btn = c.key ? (lifted ? `<button class="btn ghost" disabled>${T('publishingBtn')}</button>`
    : waiting ? `<button class="btn ghost" disabled>${label.waiting}</button>`
    : left.length ? `<button class="btn" data-pub="${esc(c.key)}">${left.length < 2 ? T('publishTo', PLAT(left[0])) : T('publishBtn')}</button>`
    : `<button class="btn ghost" disabled title="${pubOff ? 'publish.enabled: false' : ''}">${pubOff ? T('pubOff') : T('bothDone')}</button>`) : '';
  const lay = {duet_v: T('duet'), full_v: T('solo')}[c.layout] || {'连麦': T('duet'), '单人': T('solo')}[c.layout] || c.layout || '';
  const meta = [`${c.dur_v != null ? Math.round(c.dur_v) : c.dur ?? '?'}s`, c.round != null ? T('roundShort', c.round) : '', lay, c.mtime].filter(Boolean).join(' · ');
  return `<div class="clip ${lifted ? 'lifted' : ''}">${lifted ? `<span class="ribbon">${T('ribbon')}</span>` : ''}<span class="num">${pad(c.n)}</span>
    <div class="cov" ${vidAttrs(c)}>${c.cover ? `<img loading="lazy" src="${esc(c.cover)}" alt="">` : ''}${c.video ? '<span class="play"><b></b></span>' : ''}</div>
    <div class="body"><div class="ttl" title="${esc(c.title)}">${esc(c.title)}</div>
    <div class="m">${esc(meta)}</div>
    <div class="chips">${c.score != null ? `<span class="chip ${scoreCls(c.score)}" title="${T('scoreTip')}">${T('score', c.score)}</span>` : ''}${c.risky ? `<span class="chip warn">${T('controversial')}</span>` : ''}${qa}${tightChip(c)}${(c.chips || []).map(x => `<span class="chip">${esc(x)}</span>`).join('')}${plat}</div>
    ${qaWhy}${btn}</div></div>`;
}
// 播放用的属性：原版 + 精剪（有才给）和两版时长，点开播放器能切换
const vidAttrs = c => `data-v="${esc(c.video || '')}"${c.video_tight ? ` data-vt="${esc(c.video_tight)}" data-d="${c.dur_v ?? c.dur ?? ''}" data-dt="${c.dur_tight ?? ''}"` : ''}`;
const pctDiff = (a, b) => a && b ? `${b <= a ? '-' : '+'}${Math.round(Math.abs(1 - b / a) * 100)}%` : '';
const tightChip = c => c.video_tight && c.dur_tight ? `<span class="chip" title="${esc(T('verDiff', Math.round(c.dur_v ?? c.dur), Math.round(c.dur_tight), pctDiff(c.dur_v ?? c.dur, c.dur_tight)))}">${T('tightChip', Math.round(c.dur_tight))}</span>` : '';
function renderWall(ses, d){
  const clips = ses ? ses.clips : [];
  $('clipmeta').textContent = ses && ses.dir_hint ? ses.dir_hint : '';
  const rows = clips.map(c => ({c, ps: platState(c, d)}));
  const busy = r => Object.values(r.ps).some(s => ['pending', 'running'].includes(s.state));
  rows.sort((a, b) => (busy(b) - busy(a)) || (b.c.n - a.c.n));      // 正在发布的拎到最前
  const card = clipCard;
  // 分三组：正在发布 / 待发布 / 已发布（至少一个平台发了、且没有在发的）；待发布可按分数或时间排
  const byScore = (a, b) => ((b.c.score ?? -1) - (a.c.score ?? -1)) || (b.c.n - a.c.n);
  const todo = rows.filter(r => !busy(r) && !Object.values(r.ps).some(s => s.state === 'done'));
  if (SORT === 'score') todo.sort(byScore);
  const groups = [
    ['publishing', rows.filter(busy)],
    ['todo', todo],
    ['done', rows.filter(r => !busy(r) && Object.values(r.ps).some(s => s.state === 'done'))],
  ].filter(([, rs]) => rs.length);
  $('wall').innerHTML = rows.length ? groups.map(([g, rs]) => {
    const capped = rs.length > GROUP_CAP + 2 && !SHOW_ALL.has(g);
    return `<div class="group">
      <div class="ghead">${g === 'publishing' ? '<span class="spin" style="color:var(--accent)"></span>' : ''}${T(g)}<span class="n">${rs.length}</span><span class="bar2"></span>
        ${g === 'todo' ? `<span class="seg2"><button data-sort="score" class="${SORT === 'score' ? 'on' : ''}">${T('byScore')}</button><button data-sort="time" class="${SORT === 'time' ? 'on' : ''}">${T('byTime')}</button></span>` : ''}</div>

// 上传队列（浏览器这边）：一个个传，XHR 能看进度；传完服务端排进剪辑队列
const XFER = [];
let XBUSY = false;
function addFiles(files){
  files = [...files];
  if (!files.length) return;
  const one = files.length === 1;
  for (const f of files) {
    const ext = extOf(f.name);
    const x = {f, name: f.name, size: f.size, state: 'wait', loaded: 0, opts: {
      title: one ? $('upTitle').value.trim() : '', top: $('upTop').value, tight: $('upTight').checked ? '1' : '0',
      burn: $('upBurn').checked ? '1' : '0', note: $('upNote').value.trim()}};
    if (!UP_EXTS.includes(ext)) Object.assign(x, {state: 'err', err: T('upBadType', ext)});
    else if (!f.size) Object.assign(x, {state: 'err', err: T('upEmpty')});
    XFER.push(x);
  }
  $('upTitle').value = '';
  renderXfer(); pump();
  $('upPanel').scrollIntoView({behavior: 'smooth', block: 'start'});
}
function renderXfer(){
  $('upxfer').innerHTML = XFER.map((x, i) => {
    const pct = x.size ? Math.min(100, x.loaded / x.size * 100) : 0;
    const st = x.state === 'up' ? `<span class="chip run"><span class="spin"></span>${T('upSending')} ${pct.toFixed(0)}%</span>`
      : x.state === 'check' ? `<span class="chip run"><span class="spin"></span>${T('upChecking')}</span>`
      : x.state === 'done' ? `<span class="chip good">✓ ${T('upSent')}</span>` : x.state === 'err' ? `<span class="chip bad">✗</span>`
      : `<span class="chip">${T('upWait')}</span>`;

    return `<div class="job ${x.state === 'up' ? 'run' : ''}"><div class="jh">${st}<div class="jt"><b title="${esc(x.name)}">${esc(x.name)}</b>
        <div>${fmtSize(x.size)}${x.opts.title ? ' · ' + esc(x.opts.title) : ''}${sub ? ' · ' + esc(sub) : ''}</div></div>
        ${['wait', 'up', 'check'].includes(x.state) ? `<button class="btn ghost" data-xabort="${i}">${T('upAbort')}</button>` : x.state === 'err' ? `<button class="btn ghost" data-xdismiss="${i}">×</button>` : ''}</div>
      ${x.state === 'up' ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ''}

async function pump(){
  if (XBUSY) return;

  XBUSY = true;

    x.state = 'check'; renderXfer();
    const r = await fetch('/api/upload/check', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: x.name, size: x.size})});
    const j = await r.json().catch(() => ({error: `HTTP ${r.status}`}));
    if (j.error) throw new Error(j.error);

    await send(x);
  } catch (e) { if (x.state !== 'err') Object.assign(x, {state: 'err', err: T('upFail') + e.message}); }

  $('tip').textContent = t.dataset.tip; $('tip').style.display = 'block'; moveTip(e);

document.addEventListener('mousemove', e => { if (TIP_EL) moveTip(e); });
function moveTip(e){
  const tp = $('tip'), w = tp.offsetWidth, h = tp.offsetHeight;
  let x = e.clientX + 12, y = e.clientY - h - 12;
  if (x + w > innerWidth - 8) x = e.clientX - w - 12;
  if (y < 8) y = e.clientY + 16;
  tp.style.left = Math.max(8, x) + 'px'; tp.style.top = y + 'px';
}
function hideTipIfGone(){ if (TIP_EL && !document.contains(TIP_EL)) { TIP_EL = null; $('tip').style.display = 'none'; } }

let RZ = 0;
addEventListener('resize', () => { clearTimeout(RZ); RZ = setTimeout(() => { if (LAST) safe(drawTimeline, (LAST.sessions || [])[0] || null, LAST); }, 120); });
addEventListener('scroll', () => $('hdr').classList.toggle('scrolled', scrollY > 4), {passive: true});

// ---------- 发布弹窗 ----------
function bjDefault(){
  // 默认填今晚（观众时区）20:00（已过就明天）
  const now = new Date(), bj = new Date(now.toLocaleString('en-US', {timeZone: TZ}));
  if (bj.getHours() >= 20) bj.setDate(bj.getDate() + 1);
  return `${bj.getFullYear()}-${pad(bj.getMonth() + 1)}-${pad(bj.getDate())}T20:00`;
}
async function openPublish(key){
  const c = ALLCLIPS.get(key);
  $('dlg').innerHTML = `<div class="empty">${T('reading')}</div>`; $('pmodal').classList.add('open');
  let p;
  try { const r = await fetch('/api/preview?key=' + encodeURIComponent(key)); p = await r.json(); }
  catch (e) { p = {error: e.message}; }
  if (p.error){ $('dlg').innerHTML = `<div class="err" style="margin:0">${esc(p.error)}</div><div class="actions"><button class="btn ghost" data-close>${T('cancel')}</button></div>`; return; }
  const done = new Set(p.published || []);
  const plat = (k, title, tags) => `<div class="plat"><label><input type="checkbox" name="pf" value="${k}" ${done.has(k) ? 'disabled' : 'checked'}> ${PLAT(k)}${done.has(k) ? T('publishedBefore') : ''}</label>
      <div>${esc(title)}</div><div class="tags">${tags.map(t => (k === 'douyin' ? '#' : '') + esc(t)).join(k === 'douyin' ? ' ' : '，')}</div></div>`;
  $('dlg').innerHTML = `
    <h3>${T('confirmTitle')}</h3>
    <div class="top">${c && c.cover ? `<img src="${esc(c.cover)}" alt="">` : ''}<div style="min-width:0"><b>${esc(c ? c.title : '')}</b><div style="color:var(--muted);font-size:12px;margin-top:4px">${c ? `${c.dur_v != null ? Math.round(c.dur_v) : c.dur}s${c.dur_tight ? ' · ' + T('tightChip', Math.round(c.dur_tight)) : ''} · ${T('score', c.score)}` : ''}</div></div></div>
    ${(p.notes || []).map(n => `<div class="warnbox">${esc(n.slice(0, 160))}</div>`).join('')}
    ${plat('douyin', p.douyin.title, p.douyin.tags)}
    ${plat('bili', p.bili.title, p.bili.tags)}
    <div class="when">
      <label><input type="radio" name="when" value="now" checked> ${T('pubNow')}</label>
      <label><input type="radio" name="when" value="at"> ${T('pubAt')}</label>
      <input type="datetime-local" id="at" value="${bjDefault()}">
    </div>
    <div class="actions"><span class="msg" id="pmsg"></span>
      <button class="btn ghost" data-close>${T('cancel')}</button>
      <button class="btn" id="go">${T('confirm')}</button></div>`;
  $('go').onclick = async () => {
    const platforms = [...document.querySelectorAll('input[name=pf]:checked')].map(x => x.value);
    const at = document.querySelector('input[name=when]:checked').value === 'at' ? $('at').value.replace('T', ' ') : null;
    $('go').disabled = true;
    try {
      const res = await fetch('/api/publish', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({key, platforms, at})});
      const j = await res.json();
      if (j.error){ $('pmsg').textContent = j.error; $('go').disabled = false; return; }
    } catch (e) { $('pmsg').textContent = e.message; $('go').disabled = false; return; }
    $('pmodal').classList.remove('open'); toast(T('queued')); tick();
  };
}
function toast(t){ const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2500); }
// 播放器：有精剪版时上面出「原版 / 精剪」切换，默认放精剪；切换时按进度比例接着放
let PLAY = null;
function openPlayer(el){
  PLAY = {v: el.dataset.v, vt: el.dataset.vt || null, d: +el.dataset.d || null, dt: +el.dataset.dt || null};
  PLAY.which = PLAY.vt ? 'tight' : 'plain';
  $('vmodal').classList.add('open'); playSrc(0);
}
function playSrc(ratio){
  const p = $('player');
  p.src = PLAY.which === 'tight' ? PLAY.vt : PLAY.v;
  if (ratio > 0) p.addEventListener('loadedmetadata', () => { p.currentTime = ratio * p.duration; }, {once: true});
  p.play().catch(() => {});
  $('vswitch').innerHTML = PLAY.vt ? `<span class="seg2"><button data-ver="plain" class="${PLAY.which === 'plain' ? 'on' : ''}">${T('verPlain')}</button><button data-ver="tight" class="${PLAY.which === 'tight' ? 'on' : ''}">${T('verTight')}</button></span>
    ${PLAY.d && PLAY.dt ? `<span>${esc(T('verDiff', Math.round(PLAY.d), Math.round(PLAY.dt), pctDiff(PLAY.d, PLAY.dt)))}</span>` : ''}` : '';
}
function closeVideo(){ $('player').pause(); $('vmodal').classList.remove('open'); PLAY = null; }

document.addEventListener('click', async e => {
  const qa = e.target.closest('[data-qact]');
  if (qa){
    qa.disabled = true;
    try {
      const r = await fetch('/api/' + qa.dataset.qact, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: qa.dataset.id})});
      const j = await r.json(); toast(j.error || (qa.dataset.qact === 'retry' ? T('requeued') : T('cancelledToast')));
    } catch (err) { toast(err.message); }
    tick(); return;
  }
  const b = e.target.closest('[data-pub]');
  if (b){ openPublish(b.dataset.pub); return; }
  if (e.target.closest('[data-close]') || e.target.id === 'pmodal'){ $('pmodal').classList.remove('open'); return; }
  if (e.target.closest('[data-xv]') || e.target.id === 'vmodal'){ closeVideo(); return; }
  const sw = e.target.closest('[data-ver]');
  if (sw && PLAY){ const p = $('player'), r = p.duration ? p.currentTime / p.duration : 0;
    PLAY.which = sw.dataset.ver; playSrc(r); return; }
  const v = e.target.closest('[data-v]');
  if (v && v.dataset.v){ $('tip').style.display = 'none'; openPlayer(v); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('vmodal').classList.contains('open')) closeVideo();
  $('pmodal').classList.remove('open');
});

// ---------- 假数据（开发用）：?mock=live|picking|cutting|wrapping|short|empty|offline|upload|upload-idle，基于真实数据改 ----------
const MOCK = QP.get('mock');
function mock(d){
  if (!MOCK) return d;
  d = JSON.parse(JSON.stringify(d));
  if (MOCK === 'offline') throw new Error('mock offline');
  if (MOCK === 'empty'){
    Object.assign(d, {sessions: [], queue: [], publish: [], problems: [], step_name: null});
    d.editor = {running: false}; d.rec = {ok: false, error: 'ssh: connect to host recorder port 22: Operation timed out', checked: d.now.slice(6, 14)};
    d.pipeline = d.pipeline.map(p => ({...p, state: '', t: ''})); delete d.costs; return d;
  }
  if (MOCK.startsWith('upload')) {     // 手动上传：排队 / 剪辑中 / 失败各一个 + 一个正在上传的（真实任务排在后面）
    const now = (d.uploads || {}).now_ts || Date.now() / 1000;
    d.uploads = Object.assign({free_gb: 102, min_free_gb: 20, now_ts: now, jobs: []}, d.uploads || {}, {worker: MOCK === 'upload'});
    if (MOCK === 'upload-idle') { d.uploads.jobs = []; return d; }
    const base = {opts: {top: null, tight: true, burn: true, note: ''}, vertical: true, top_auto: 8, w: 720, h: 1280, clips: []};
    d.uploads.jobs = [
      {...base, id: 'UP_mock_3', name: '10月15号直播.ts', title: '10月15号直播', size: 3.4e9, dur: 4680, status: 'pending', created: '10-15 22:41:07', top_auto: 8},
      {...base, id: 'UP_mock_2', name: '连麦回放.mp4', title: '连麦回放', size: 1.9e9, dur: 2950, status: 'running', step: 'pick', started_ts: now - 262, top_used: 5, top_auto: 5, cost: {usd: 0.41, cny: 0.018}},
      {...base, id: 'UP_mock_1', name: '横屏访谈.mov', title: '横屏访谈', vertical: false, w: 1920, h: 1080, size: 0.8e9, dur: 1500, status: 'failed', step: 'review',
       started_ts: now - 900, finished_ts: now - 700, retried: 1, top_auto: 3,
       error: '[    98s] $ python -m liveclip.review.subs data/asr/UP_mock_1_bailian.json --out …\nTimeoutError: claude -p 超时\n失败：liveclip.review.subs'},
      ...d.uploads.jobs];
    if (!XFER.some(x => x.mock)) XFER.push({mock: true, name: '10月16号主号直播.ts', size: 5.2e9, loaded: 2.24e9, speed: 412e6, state: 'up', opts: {title: ''}});
    return d;
  }
  const s = (d.sessions || [])[0]; if (!s) return d;
  const P = {live: [172, 8, 'recognize', 'waiting'], picking: [181, 8, 'pick', 'picking'], cutting: [183, 9, 'cut', 'cutting'],
             short: [21.4, 1, null, 'waiting'], wrapping: [null, 20, 'cut', 'cutting']}[MOCK];
  if (!P) return d;
  const [T0, rounds, step, kind] = P;
  const pickedTo = MOCK === 'wrapping' ? 420 : rounds * 20;
  let cutting = [];
  if (T0 != null) {
    let acc = 0; s.segments = s.segments.filter(x => (acc += x.dur / 60) <= T0 + 0.01);
    s.total_min = +(s.segments.reduce((a, x) => a + x.dur, 0) / 60).toFixed(1);
    s.ended = false; s.done = false; s.full = {ready: false};
    d.rec.live = [{name: s.anchor, elapsed: hms(s.total_min)}];
  } else { s.ended = true; s.done = false; s.full = {ready: false}; }
  s.clips = s.clips.filter(c => (c.round || 0) <= rounds);
  if (kind === 'cutting') { cutting = s.clips.filter(c => c.round === rounds).map(c => ({n: c.n, title: c.title})); s.clips = s.clips.filter(c => c.round !== rounds); }
  s.rounds = rounds; s.picked_until_min = Math.min(pickedTo, s.total_min); s.next_round_min = pickedTo + 20;
  s.decisions.rounds = s.decisions.rounds.filter(r => r.r <= rounds);
  s.decisions.cutting = cutting;
  s.decisions.now = kind === 'picking' ? {kind, round: rounds + 1} : kind === 'cutting' ? {kind, round: rounds} : {kind: 'waiting', next_min: s.next_round_min};
  if (MOCK === 'short') s.deferred = ['示例标题 / 第二行'];
  d.editor.current = step ? {step, elapsed: '00:41', cmd: ''} : null;
  const idx = d.pipeline.findIndex(p => p.key === step);
  d.pipeline = d.pipeline.map((p, i) => ({...p, state: (p.key === 'record' && T0 != null) || p.key === step ? 'active' : step && i < idx ? 'done' : !step && i < 4 ? 'done' : '',
    t: p.key === 'record' && T0 != null ? hms(s.total_min) : p.key === step ? '00:41' : ''}));
  d.step_name = step ? (d.pipeline[idx] || {}).name : null;
  return d;
}

async function tick(){
  try {
    const r = await fetch('/api/status?lang=' + LANG, {cache: 'no-store'});
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    render(mock(d));
    applyShot();
  } catch (e) {
    $('conn').className = 'dot bad';
    $('err').innerHTML = `<div class="err">${T('cantConnect')}${esc(e.message)}${LAST ? T('stale') : ''}</div>`;
  }
}
function clock(){
  const loc = LANG === 'en' ? 'en-US' : 'zh-CN';
  const bj = new Intl.DateTimeFormat(loc, {timeZone: TZ, month: '2-digit', day: '2-digit', weekday: 'short', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false}).format(new Date());
  const lo = new Intl.DateTimeFormat(loc, {hour: '2-digit', minute: '2-digit', hour12: false}).format(new Date());
  $('bj').innerHTML = `${T('bj')} ${bj}<small>${T('local')} ${lo}</small>`;
}
// ---------- 截图模式：?only=top|decisions|wall|queue|cost|events|publish|upload ----------
const SHOT = {top: ['health', 'pipePanel', 'session'], decisions: ['decPanel'], wall: ['wallPanel'],
              queue: ['queuePanel', 'pubPanel'], cost: ['costPanel'], events: ['eventsPanel'], publish: ['wallPanel'], upload: ['upPanel']};
let shotDone = false;
function applyShot(){
  const only = QP.get('only');
  if (!only || !SHOT[only] || shotDone || !LAST) return;
  shotDone = true;
  document.body.classList.add('shot');
  SHOT[only].forEach(id => $(id) && $(id).classList.add('keep'));
  if (LAST) safe(drawTimeline, (LAST.sessions || [])[0] || null, LAST);   // 布局变宽了，重排时间轴
  if (only === 'decisions') {          // 展开最新一轮第一条选中的，看得到理由和预告候选
    const d = document.querySelector('details.round[open] details.dec'); if (d) { d.open = true; OPEN.add(d.dataset.k); }
  }
  if (only === 'publish') {            // 打开发布确认弹窗（只打开，不提交）
    const b = document.querySelector('[data-pub]'); if (b) openPublish(b.dataset.pub);
  }
}
if (MOCK) $('mockflag').innerHTML = `<span class="mockflag">MOCK · ${esc(MOCK)}</span>`;
applyStatic(); clock(); setInterval(clock, 1000);
tick(); setInterval(tick, 5000);
</script>
